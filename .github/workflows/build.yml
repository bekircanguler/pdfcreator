name: Build Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pillow reportlab flask pyinstaller customtkinter pypdf

      - name: Build EXE
        run: >
          pyinstaller
          --noconfirm
          --onefile
          --windowed
          --name FotografPDFConverter
          --collect-data customtkinter
          --add-data "config.json;."
          src/gui_app.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: FotografPDFConverter
          path: dist/FotografPDFConverter.exe
          retention-days: 30

name: Build Windows EXE

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pillow reportlab pyinstaller customtkinter pypdf python-docx pywin32 windnd

      - name: Smoke-test new dependencies
        run: python -c "import win32clipboard, windnd"

      - name: Generate brand assets (app.ico, logo.png)
        run: python tools/generate_brand_assets.py

      - name: Build EXE
        run: >
          pyinstaller
          --noconfirm
          --onefile
          --windowed
          --name "Bilgi Notu"
          --icon app.ico
          --collect-data customtkinter
          --collect-all docx
          --hidden-import note_engine
          --hidden-import win32clipboard
          --hidden-import win32con
          --add-data "config.json;."
          --add-data "app.ico;."
          --add-data "logo.png;."
          src/gui_app.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bilgi Notu
          path: "dist/Bilgi Notu.exe"
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "dist/Bilgi Notu.exe"
